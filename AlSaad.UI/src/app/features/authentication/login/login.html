<div class="auth-screen" dir="rtl">
  <aside class="brand-panel">
    <div class="brand-panel__content">
      <span class="brand-mark">السعد</span>
      <p class="brand-tagline">سوق العربيات اللي تثق فيه</p>
      <div class="road-line"></div>
    </div>
  </aside>

  <main class="form-panel">
    <form class="auth-card">
      <h1 class="auth-card__title">تسجيل الدخول</h1>
      <p class="auth-card__subtitle">دخّل بياناتك عشان تكمل</p>

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" placeholder="example@mail.com" />
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" placeholder="••••••••" />
      </div>

      <button type="submit" class="btn-primary">دخول</button>

      <p class="auth-card__footer">
        مستخدم جديد؟ <a routerLink="/register">اعمل حساب</a>
      </p>
    </form>
  </main>
</div>
