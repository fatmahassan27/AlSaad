<a routerLink="/inventory/stores" class="back-link">→ رجوع لكل المخازن</a>

<div *ngIf="isLoading" class="status-message">جاري التحميل...</div>
<div *ngIf="errorMessage" class="status-message error">{{ errorMessage }}</div>

<div *ngIf="store && !isLoading" class="details-card">
  <h1>{{ store.name }}</h1>

  <div class="info-grid">
    <div><span class="label">العنوان:</span> {{ store.shippingAddress || '-' }}</div>
    <div><span class="label">مخزن رئيسي:</span> {{ store.isPrimary ? 'نعم' : 'لا' }}</div>
    <div><span class="label">الحالة:</span> {{ getStatusLabel(store.activeStatus) }}</div>
  </div>
</div>
