<section class="page-header">
  <h1>الماركات</h1>
</section>

<div *ngIf="isLoading" class="status-message">جاري التحميل...</div>
<div *ngIf="errorMessage" class="status-message error">{{ errorMessage }}</div>

<div class="table-wrapper" *ngIf="!isLoading && !errorMessage">
  <table class="data-table">
    <thead>
      <tr>
        <th>الاسم</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let brand of brands">
        <td>{{ brand.name }}</td>
        <td><a [routerLink]="['/inventory/brands', brand.id]" class="view-link">عرض التفاصيل</a></td>
      </tr>
      <tr *ngIf="brands.length === 0">
        <td colspan="2" class="empty-row">مفيش ماركات لعرضها</td>
      </tr>
    </tbody>
  </table>
</div>
