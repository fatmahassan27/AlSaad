<section class="page-header">
  <h1>قوالب الوحدات</h1>
</section>

<div *ngIf="isLoading" class="status-message">جاري التحميل...</div>
<div *ngIf="errorMessage" class="status-message error">{{ errorMessage }}</div>

<div class="table-wrapper" *ngIf="!isLoading && !errorMessage">
  <table class="data-table">
    <thead>
      <tr>
        <th>اسم القالب</th>
        <th>الوحدة الأساسية</th>
        <th>الاختصار</th>
        <th>الحالة</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of templates">
        <td>{{ t.templateName }}</td>
        <td>{{ t.mainUnitName }}</td>
        <td>{{ t.unitSmallName || '-' }}</td>
        <td>
          <span [class]="t.isActive ? 'badge active' : 'badge inactive'">
            {{ t.isActive ? 'نشط' : 'موقوف' }}
          </span>
        </td>
        <td><a [routerLink]="['/inventory/unit-templates', t.id]" class="view-link">عرض التفاصيل</a></td>
      </tr>
      <tr *ngIf="templates.length === 0">
        <td colspan="5" class="empty-row">مفيش قوالب وحدات لعرضها</td>
      </tr>
    </tbody>
  </table>
</div>
