<!-- Overlay -->
<div
  class="sidebar-overlay"
  [class.visible]="isOpen"
  (click)="closeSidebar()"
></div>


<!-- Sidebar -->
<aside
  class="sidebar"
  [class.open]="isOpen"
  dir="rtl"
>

  <!-- Header -->
  <div class="sidebar-header">

    <a
      routerLink="/home"
      class="sidebar-brand"
      (click)="closeSidebar()"
    >

      <div class="brand-icon">
        <span class="material-icons">
          directions_car
        </span>
      </div>

      <div class="brand-text">
        <span class="brand-name">
          السعد
        </span>

        <span class="brand-subtitle">
          قطع غيار السيارات
        </span>
      </div>

    </a>

    <button
      type="button"
      class="close-sidebar"
      aria-label="إغلاق القائمة"
      (click)="closeSidebar()"
    >
      <span class="material-icons">
        close
      </span>
    </button>

  </div>


  <!-- Content -->
  <div class="sidebar-content">

    <div class="menu-title">
      القائمة الرئيسية
    </div>

    <ul class="menu">

      <li
        *ngFor="let category of categories"
        class="menu-item"
        [class.has-children]="category.children"
      >

        <!-- ================= DIRECT LINK ================= -->

        <a
          *ngIf="category.path"
          [routerLink]="category.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="menu-link"
          (click)="closeSidebar()"
        >

          <span class="menu-icon material-icons">
            folder
          </span>

          <span class="menu-label">
            {{ category.label }}
          </span>

          <span class="link-arrow material-icons">
            chevron_left
          </span>

        </a>


        <!-- ================= PARENT MENU ================= -->

        <button
          *ngIf="!category.path && category.children"
          type="button"
          class="menu-link menu-button"
          [class.active]="isSubmenuOpen(category)"
          (click)="toggleSubmenu(category)"
        >

          <span class="menu-icon material-icons">
            folder
          </span>

          <span class="menu-label">
            {{ category.label }}
          </span>

          <span
            class="dropdown-arrow material-icons"
            [class.rotated]="isSubmenuOpen(category)"
          >
            expand_more
          </span>

        </button>


        <!-- ================= SUBMENU ================= -->

        <ul
          *ngIf="category.children"
          class="submenu"
          [class.expanded]="isSubmenuOpen(category)"
        >

          <li
            *ngFor="let child of category.children"
            class="submenu-item"
          >

            <a
              [routerLink]="child.path"
              routerLinkActive="active"
              class="submenu-link"
              (click)="closeSidebar()"
            >

              <span class="submenu-line"></span>

              <span class="submenu-label">
                {{ child.label }}
              </span>

            </a>

          </li>

        </ul>

      </li>

    </ul>

  </div>

</aside>
